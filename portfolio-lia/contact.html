<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Lia Rarasari</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigasi -->
    <nav>
        <div class="container">

            <div class="logo">
                Lia Rarasari
            </div>

            <ul class="nav-links">
                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="about.html">About</a>
                </li>

                <li>
                    <a href="contact.html" class="active">Contact</a>
                </li>
            </ul>

        </div>
    </nav>


    <!-- Contact -->
    <section class="hero">

        <div class="container">

            <div class="hero-content">

                <p class="small-text">
                    LET'S GET IN TOUCH
                </p>

                <h1>
                    Contact
                    <span>Me</span>
                </h1>

                <p class="hero-description">
                    Punya pertanyaan, ingin berdiskusi, atau ingin
                    menghubungi saya? Silakan isi form di bawah ini.
                </p>


                <!-- Form -->
                <form id="contact-form">

                    <p>
                        <label for="nama">
                            Nama
                        </label>

                        <br>

                        <input
                            type="text"
                            id="nama"
                            placeholder="Masukkan nama kamu"
                            required
                        >
                    </p>


                    <p>
                        <label for="email">
                            Email
                        </label>

                        <br>

                        <input
                            type="email"
                            id="email"
                            placeholder="Masukkan email kamu"
                            required
                        >
                    </p>


                    <p>
                        <label for="pesan">
                            Pesan
                        </label>

                        <br>

                        <textarea
                            id="pesan"
                            rows="5"
                            placeholder="Tulis pesan kamu di sini..."
                            required
                        ></textarea>
                    </p>


                    <button
                        type="submit"
                        class="btn"
                    >
                        Kirim Pesan
                    </button>

                </form>

            </div>

        </div>

    </section>


    <!-- Footer -->
    <footer>

        <div class="container">

            <p>
                Made with love by Lia Rarasari
            </p>

            <p>
                &copy; 2026 Lia Rarasari
            </p>

        </div>

    </footer>


    <script src="js/main.js"></script>

</body>
</html>
