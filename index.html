<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UTS Pemrograman Web Dasar - Random Quote</title> 
  <style>
    /* Styling Dasar dan Reset */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f0f4f8;
      color: #333;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* Semantic Header */
    header {
      width: 100%;
      max-width: 600px;
      background-color: #34495e;
      color: #fff;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 25px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    header h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
    }

    header p {
      font-size: 0.95rem;
      color: #bdc3c7;
    }

    /* Semantic Main */
    main {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Kartu Quote */
    .quote-card {
      background: #ffffff;
      width: 100%;
      padding: 35px 30px;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.08);
      text-align: center;
      border-left: 6px solid #3498db;
      margin-bottom: 25px;
      position: relative;
    }

    .quote-text {
      font-size: 1.25rem;
      font-style: italic;
      color: #2c3e50;
      line-height: 1.6;
      margin-bottom: 15px;
    }

    .quote-author {
      font-size: 1rem;
      font-weight: 600;
      color: #7f8c8d;
      text-align: right;
    }

    /* Container Tombol Action */
    .button-group {
      display: flex;
      gap: 15px;
      width: 100%;
      justify-content: center;
    }

    button {
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s, transform 0.1s;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-next {
      background-color: #3498db;
      color: white;
    }

    .btn-next:hover {
      background-color: #2980b9;
    }

    .btn-copy {
      background-color: #2ecc71;
      color: white;
    }

    .btn-copy:hover {
      background-color: #27ae60;
    }

    /* Pesan Aler/Notifikasi Salin */
    .toast {
      margin-top: 15px;
      padding: 8px 16px;
      background-color: #2c3e50;
      color: white;
      font-size: 0.85rem;
      border-radius: 4px;
      display: none;
    }

    /* Semantic Footer */
    footer {
      margin-top: auto;
      padding-top: 30px;
      text-align: center;
      font-size: 0.85rem;
      color: #7f8c8d;
    }

    /* Media Query Responsif */
    @media (max-width: 480px) {
      body {
        padding: 12px;
      }

      .quote-card {
        padding: 25px 20px;
      }

      .button-group {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- Header dengan Identitas dan NIM pada Variabel/ID -->
  <header id="header_2024001">
    <h1>Generator Quote Motivasi</h1>
    <p>NIM: H1101251025 | Nama: Lia Rarasari</p>
  </header>

  <!-- Main Section -->
  <main id="main_2024001">
    <!-- Kartu Menampilkan Quote -->
    <section class="quote-card" id="card_2024001">
      <p class="quote-text" id="text_quote_2024001">"Memuat quote..."</p>
      <p class="quote-author" id="author_quote_2024001">- Penulis</p>
    </section>

    <!-- Tombol Kontrol -->
    <div class="button-group">
      <button type="button" class="btn-next" onclick="tampilkanQuoteAcak_2024001()">Quote Baru</button>
      <button type="button" class="btn-copy" onclick="salinKeClipboard_2024001()">Salin Quote</button>
    </div>

    <!-- Notifikasi Toast -->
    <div id="toast_2024001" class="toast">Quote berhasil disalin ke clipboard!</div>
  </main>

  <footer>
    <p>&copy; 2026 UTS Pemrograman Web Dasar. All rights reserved.</p>
  </footer>

  <script>
    const daftarQuote_2024001 = [
      { quote: "Pendidikan adalah senjata paling mematikan di dunia, karena dengan pendidikan Anda dapat mengubah dunia.", author: "Nelson Mandela" },
      { quote: "Satu-satunya cara untuk melakukan pekerjaan besar adalah dengan mencintai apa yang Anda kerjakan.", author: "Steve Jobs" },
      { quote: "Jangan tunda pekerjaanmu sampai besok, jika kamu bisa mengerjakannya hari ini.", author: "Benjamin Franklin" },
      { quote: "Usaha tidak pernah mengkhianati hasil.", author: "Peribahasa" },
      { quote: "Sukses berjalan dari kegagalan ke kegagalan tanpa kehilangan antusiasme.", author: "Winston Churchill" },
      { quote: "Masa depan bergantung pada apa yang Anda lakukan hari ini.", author: "Mahatma Gandhi" },
      { quote: "Berpikirlah besar dan jangan mendengarkan orang-orang yang memberitahumu bahwa itu tidak bisa dilakukan.", author: "Tim Ferriss" },
      { quote: "Ilmu tanpa amal adalah hampa, amal tanpa ilmu adalah buta.", author: "Bung Hatta" }
    ];

    let indeksTerakhir_2024001 = -1;

    function tampilkanQuoteAcak_2024001() {
      let indeksAcak_2024001;

      do {
        indeksAcak_2024001 = Math.floor(Math.random() * daftarQuote_2024001.length);
      } while (indeksAcak_2024001 === indeksTerakhir_2024001 && daftarQuote_2024001.length > 1);

      indeksTerakhir_2024001 = indeksAcak_2024001;
      const quoteAktif_2024001 = daftarQuote_2024001[indeksAcak_2024001];

      document.getElementById('text_quote_2024001').innerText = `"${quoteAktif_2024001.quote}"`;
      document.getElementById('author_quote_2024001').innerText = `- ${quoteAktif_2024001.author}`;
    }

    function salinKeClipboard_2024001() {
      const teks_2024001 = document.getElementById('text_quote_2024001').innerText;
      const penulis_2024001 = document.getElementById('author_quote_2024001').innerText;
      const teksLengkap_2024001 = `${teks_2024001} ${penulis_2024001}`;

      navigator.clipboard.writeText(teksLengkap_2024001).then(() => {
        const toast_2024001 = document.getElementById('toast_2024001');
        toast_2024001.style.display = 'block';
        
        setTimeout(() => {
          toast_2024001.style.display = 'none';
        }, 2000);
      }).catch(err => {
        alert('Gagal menyalin quote: ' + err);
      });
    }

    window.onload = function() {
      tampilkanQuoteAcak_2024001();
    };
  </script>
</body>   
</html>
